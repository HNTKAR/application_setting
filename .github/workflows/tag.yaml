name: Update Release and Version Tags

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to assign to the latest commit (example: v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update release and version tags to latest commit
        env:
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
          RELEASE_TAG: latest
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$VERSION_TAG"
          git push origin "$VERSION_TAG" --force

          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" --force